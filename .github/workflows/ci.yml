name: CI
on:
  pull_request:
  push:
    branches: [main, develop]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build, test and audit every Node package
        run: |
          find . -name package.json -not -path '*/node_modules/*' | while read -r file; do
            dir=$(dirname "$file")
            (cd "$dir" && npm install && npm run build --if-present && npm test --if-present && npm audit --audit-level=high)
          done
